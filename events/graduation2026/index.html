<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:image" content="../../images/bg/poster.jpg">
	<title>Primary School Graduation - Muse Tuan</title>
    <link href="https://cdn.jsdelivr.net/npm/hje@3.1.0/docs/css/site.heart.css" rel="stylesheet" />
    <link href="../../css/current.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="../../images/logos/logo-2026-paint.png" />
	<style type="text/css">
	body > section.x-part-greetings {
		text-align: center; padding: 60px 20px 0px 20px; border-top: 1px solid #222; border-bottom: 1px solid #333; user-select: none;
	}
	body > section.x-part-greetings > section:first-child > span:first-child {
		color: #F7C; background-color: rgba(10, 10, 10, 0.4); font-size: 32px; padding: 20px 60px; border-radius: 60px;
	}
	body > section.x-part-greetings > section:first-child > span:first-child + span {
		color: #999; font-size: 24px; margin: 40px 0 60px 0; display: block;
	}
	body > section.x-part-front > section, body > section.x-zone-photos, body > section > section.x-zone-photos {
		text-align: center;
	}
	body > section.x-part-front > section:first-child > img:first-child {
		width: 100%; margin: 0; border-radius: 8px;
	}
	body > section.x-zone-photos > section {
		padding-top: 10px; padding-bottom: 10px; user-select: none;
	}
	body > section.x-zone-photos > section > img {
		width: 100%; max-width: 800px; min-width: 160px; min-height: 120px; margin: 10px 0; border-radius: 8px; background-color: #333;
	}
	@media screen and (max-width:800px) {
		body > header:first-child {
			height: 60px;
		}
		body > header:first-child > section:first-child > h1 + ul {
			display: none;
		}
		body > section.x-part-greetings > section:first-child > span:first-child {
			font-size: 24px; padding: 20px 40px; 
		}
		body > section.x-part-greetings > section:first-child > span:first-child + span {
			font-size: 20px;
		}
	}
	@media screen and (max-width:500px) {
		body > section.x-part-greetings > section:first-child > span:first-child {
			font-size: 20px;
		}
		body > section.x-part-greetings > section:first-child > span:first-child + span {
			font-size: 18px;
		}
	}
	</style>
</head>
<body>
	<header>
        <section>
            <h1><img alt="Muse Tuan" src="../../images/logos/logo-2026-paint.png" /><a href="https://musetuan.com"><strong>Muse</strong><span>Tuan.com</span></a></h1>
            <ul>
            </ul>
        </section>
	</header>
	<section class="x-part-greetings x-bg-emphasis" >
		<section>
			<span>Graduation</span>
			<span>Primary School &nbsp; | &nbsp; 2026</span>
		</section>
	</section>
	<section class="x-zone-photos" >
		<section>
			<img alt="晚会" src="1782488878234.webp" loading="lazy" />
			<img alt="晚会" src="1782488718246.webp" loading="lazy" />
			<img alt="班级写真" src="20260524_130646.webp" loading="lazy" />
			<img alt="班级写真" src="20260524_140619.webp" loading="lazy" />
		</section>
	</section>
	<footer>
		<section>
			<div class="x-copyright">
				<img src="../../images/logos/barcode.svg" />
				<span>&copy; 2026 Muse Tuan &amp; Kingcean Tuan</span>
            		</div>
		</section>
	</footer>
</body>
</html>
