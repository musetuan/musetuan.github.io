<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:image" content="../../images/bg/poster.jpg">
	<title>Typing Test - Muse Tuan</title>
    <link href="https://cdn.jsdelivr.net/npm/hje@3.1.0/docs/css/site.heart.css" rel="stylesheet" />
    <link href="../../css/current.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="../../images/logos/logo-2026-paint.png" />
    <style>
    body > header:first-child + section {
        height: 600px;
    }
    body > header:first-child + section > section:first-child > input {
        font-size: 20px; width: 80%;
    }
    </style>
    <script>
    let time;
    function onPageLoad() {
        let inputEle = document.getElementById("input");
        let duration = document.getElementById("duration");
        inputEle.addEventListener("keypress", ev => {
            if (!inputEle.value) time = new Date();
            else duration.innerText = ((new Date().getTime() - time.getTime()) / 1000) + "s";
        });
    }
    </script>
</head>
<body onload="onPageLoad()">
	<header>
        <section>
            <h1><img alt="Muse Tuan" src="../../images/logos/logo-2026-paint.png" /><a href="https://musetuan.com"><strong>Muse</strong><span>Tuan.com</span></a></h1>
            <ul>
            </ul>
        </section>
	</header>
	<section class="x-part-greetings x-bg-emphasis" >
		<section>
			<input type="text" id="input" />
		</section>
		<section>
			<span id="duration" />
		</section>
	</section>
	<footer>
		<section>
			<div class="x-copyright">
				<img src="../../images/logos/barcode.svg" />
				<span>&copy; 2026 Muse Tuan &amp; Kingcean Tuan</span>
            		</div>
		</section>
	</footer>
</body>
</html>
