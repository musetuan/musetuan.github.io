<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:image" content="../../images/bg/poster.jpg">
	<title>Typing Test - Muse Tuan</title>
    <link href="https://cdn.jsdelivr.net/npm/hje@3.1.0/docs/css/site.heart.css" rel="stylesheet" />
    <link href="../../css/current.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="../../images/logos/logo-2026-paint.png" />
    <style>
    body > header:first-child + section {
        min-height: 600px;
    }
    body > header:first-child + section > section:first-child > input {
        font-size: 20px; width: 80%;
    }
    </style>
    <script>
    function toTime(time) {
        var h = time.getHours();
        var m = time.getMinutes();
        var s = time.getSeconds();
        return (h > 9 ? "" : "0") + h + ":" + (m > 9 ? "" : "0") + m + ":" + (s > 9 ? "" : "0") + s;
    }
    function onPageLoad() {
        const col = [];
        let item;
        const inputEle = document.getElementById("input");
        const duration = document.getElementById("duration");
        const list = document.getElementById("list");
        inputEle.addEventListener("keypress", ev => {
            var text = inputEle.value;
            if (!text || !item) {
                item = { start: new Date(), value: "" };
                col.push(item);
            } else if (ev.keyCode == 13) {
                const li = document.createElement("li");
                const s = toTime(item.start) + " | " + (item.cost ?? -1) + "s | " + inputEle.value;
                const len = list.children.length;
                if (len > 0 && list.children[len - 1].innerHTML === s) return;
                li.innerText = s;
                list.appendChild(li);
            } else {
                item.cost = (new Date().getTime() - item.start.getTime()) / 1000
                duration.innerText = item.cost + "s";
                item.value = text;
            }
        });
        inputEle.focus();
    }
    </script>
</head>
<body onload="onPageLoad()">
	<header>
        <section>
            <h1><img alt="Muse Tuan" src="../../images/logos/logo-2026-paint.png" /><a href="https://musetuan.com"><strong>Muse</strong><span>Tuan.com</span></a></h1>
            <ul>
            </ul>
        </section>
	</header>
	<section class="x-part-greetings x-bg-emphasis" >
		<section>
			<input type="text" id="input" autocomplete="off" />
		</section>
		<section>
			<span id="duration" />
		</section>
		<section>
			<ol id="list">
            </ol>
		</section>
	</section>
	<footer>
		<section>
			<div class="x-copyright">
				<img src="../../images/logos/barcode.svg" />
				<span>&copy; 2026 Muse Tuan &amp; Kingcean Tuan</span>
            		</div>
		</section>
	</footer>
</body>
</html>
